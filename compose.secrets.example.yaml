# Optional overlay: docker compose -f compose.yaml -f compose.secrets.example.yaml up -d --build
# TIMEBIN_SECRETS_DIR must point to an absolute directory outside this checkout.
services:
  web:
    secrets:
      - source: deletion_key
        target: TempBin__DeletionKey
      - source: redis_connection
        target: TempBin__Redis
secrets:
  deletion_key:
    file: ${TIMEBIN_SECRETS_DIR:?Set an external secrets directory}/deletion-key
  redis_connection:
    file: ${TIMEBIN_SECRETS_DIR:?Set an external secrets directory}/redis-connection
